<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call flow</title>
<style>
.cpf{--cpf-page:#ffffff;--cpf-ink:#17232e;--cpf-mut:#5d6d7a;
--cpf-line:#b7c2cc;--cpf-head:#e8eef4;--cpf-accent:#2f6b8f;
--cpf-hl:rgba(255,212,89,.28);--cpf-note-fill:#fff8dd;--cpf-note-line:#c8b45f;
--cpf-media:#008080;--cpf-pill:#eef3f8;
container-type:inline-size;container-name:cpf;
font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;
color:var(--cpf-ink);background:var(--cpf-page)}
@media (prefers-color-scheme:dark){.cpf{--cpf-page:#101821;--cpf-ink:#dbe4ec;
--cpf-mut:#93a4b1;--cpf-line:#3a4652;--cpf-head:#1c2632;--cpf-accent:#4182ad;
--cpf-hl:rgba(255,212,89,.16);--cpf-note-fill:#2c2b1c;--cpf-note-line:#c8b45f;
--cpf-media:#3fc0b6;--cpf-pill:#243040}}
.cpf-head h1{font-size:20px;margin:0}
.cpf-head p{margin:0;color:var(--cpf-mut)}
.cpf-radio{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.cpf-switch{display:inline-block;margin-top:8px}
.cpf-switch label{cursor:pointer;margin-right:14px}
.cpf:has(.cpf-radio[id$="lay-tb"]:focus-visible) .cpf-switch label[for$="lay-tb"]{outline:2px solid var(--cpf-accent);outline-offset:2px}
.cpf:has(.cpf-radio[id$="lay-sbs"]:focus-visible) .cpf-switch label[for$="lay-sbs"]{outline:2px solid var(--cpf-accent);outline-offset:2px}
.cpf-main{display:grid;grid-template-columns:1fr}
.cpf-scroll{overflow-x:auto}
.cpf-tscroll{overflow:auto}
@container cpf (min-width:1100px){
.cpf:has(.cpf-radio[id$="lay-sbs"]:checked) .cpf-main{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);height:var(--cpf-pane-h,100vh)}
.cpf:has(.cpf-radio[id$="lay-sbs"]:checked) .cpf-flow,.cpf:has(.cpf-radio[id$="lay-sbs"]:checked) .cpf-detail{height:100%;overflow:hidden;display:flex;flex-direction:column}
.cpf:has(.cpf-radio[id$="lay-sbs"]:checked) .cpf-scroll,.cpf:has(.cpf-radio[id$="lay-sbs"]:checked) .cpf-tscroll{flex:1;overflow:auto}
}
.cpf-svg{display:block}
.lf{stroke:var(--cpf-line)}
.pf-box{fill:var(--cpf-head);stroke:var(--cpf-line)}
.lb,.cap,.bn{font-size:13px}
.lb{font-family:ui-sans-serif,system-ui,sans-serif}
.cap{font-family:ui-monospace,Menlo,Consolas,monospace}
.ln{stroke:var(--cpf-ink);stroke-width:1.5}
.cpf .ev-media .ln{stroke:var(--cpf-media)}
.ah{stroke:none}
.nt{fill:var(--cpf-note-fill);stroke:var(--cpf-note-line)}
.bdg{fill:var(--cpf-accent)}
.bn{font-family:ui-monospace,Menlo,Consolas,monospace}
.badge text-decoration:none
.hl{opacity:0}
.cpf g:target>.hl{opacity:1;fill:var(--cpf-hl)}
.ev{scroll-margin:40px 120px}
@media (prefers-reduced-motion:reduce){.hl{transition:none}}
@media (prefers-reduced-motion:no-reduce){.hl{transition:opacity .18s ease}}
table{border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--cpf-line)}
thead th{position:sticky;top:0;z-index:2;background:var(--cpf-head);color:var(--cpf-ink)}
table th[scope="row"]{position:sticky;left:0;z-index:1;background:var(--cpf-page)}
.back{color:var(--cpf-mut)}
tr:target th,tr:target td{background:var(--cpf-hl)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--cpf-pill)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
td:nth-child(6){text-align:right;font-variant-numeric:tabular-nums}
@media print{.cpf-radio{display:none}.cpf-switch{display:none}.cpf-main{grid-template-columns:1fr}.cpf-flow,.cpf-detail{height:auto}}

</style>
</head>
<body>
<div class="cpf">
<input type="radio" name="layout" id="lay-tb" class="cpf-radio">
<input type="radio" name="layout" id="lay-sbs" class="cpf-radio" checked>
<header class="cpf-head">
<h1>Call flow</h1>
<p>5 participants · 3 events</p>
<div class="cpf-switch" role="group" aria-label="Layout">
<label for="lay-tb">Top and bottom</label>
<label for="lay-sbs">Side by side</label>
</div>
</header>
<div class="cpf-main">
<section class="cpf-flow" aria-label="Diagram"><div class="cpf-scroll">
<svg class="cpf-svg" xmlns="http://www.w3.org/2000/svg" width="806" height="226" viewBox="0 0 806 226" role="img" aria-label="Call flow diagram">
<line class="lf" x1="103" x2="103" y1="46" y2="214" stroke="var(--cpf-line, #b7c2cc)" stroke-dasharray="1 3"/>
<line class="lf" x1="253" x2="253" y1="46" y2="214" stroke="var(--cpf-line, #b7c2cc)" stroke-dasharray="1 3"/>
<line class="lf" x1="403" x2="403" y1="46" y2="214" stroke="var(--cpf-line, #b7c2cc)" stroke-dasharray="1 3"/>
<line class="lf" x1="553" x2="553" y1="46" y2="214" stroke="var(--cpf-line, #b7c2cc)" stroke-dasharray="1 3"/>
<line class="lf" x1="703" x2="703" y1="46" y2="214" stroke="var(--cpf-line, #b7c2cc)" stroke-dasharray="1 3"/>
<g class="pf">
<rect class="pf-box" x="91.2" y="16" width="23.6" height="30" rx="4" fill="var(--cpf-head, #e8eef4)" stroke="var(--cpf-line, #b7c2cc)"/>
<text class="lb" x="103" y="27" fill="var(--cpf-ink, #17232e)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">A</text>
</g>
<g class="pf">
<rect class="pf-box" x="241.2" y="16" width="23.6" height="30" rx="4" fill="var(--cpf-head, #e8eef4)" stroke="var(--cpf-line, #b7c2cc)"/>
<text class="lb" x="253" y="27" fill="var(--cpf-ink, #17232e)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">B</text>
</g>
<g class="pf">
<rect class="pf-box" x="391.2" y="16" width="23.6" height="30" rx="4" fill="var(--cpf-head, #e8eef4)" stroke="var(--cpf-line, #b7c2cc)"/>
<text class="lb" x="403" y="27" fill="var(--cpf-ink, #17232e)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">C</text>
</g>
<g class="pf">
<rect class="pf-box" x="541.2" y="16" width="23.6" height="30" rx="4" fill="var(--cpf-head, #e8eef4)" stroke="var(--cpf-line, #b7c2cc)"/>
<text class="lb" x="553" y="27" fill="var(--cpf-ink, #17232e)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">D</text>
</g>
<g class="pf">
<rect class="pf-box" x="691.2" y="16" width="23.6" height="30" rx="4" fill="var(--cpf-head, #e8eef4)" stroke="var(--cpf-line, #b7c2cc)"/>
<text class="lb" x="703" y="27" fill="var(--cpf-ink, #17232e)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">E</text>
</g>
<g class="ev ev-message" id="flow-e1">
<rect class="hl" x="0" y="68" width="100%" height="46" fill="none"/>
<line class="ln" x1="103" y1="107" x2="244" y2="107" stroke="var(--cpf-ink, #17232e)"/>
<polygon class="ah" points="253,107 244,103 244,111" fill="var(--cpf-ink, #17232e)"/>
<text class="cap" x="178" y="88" text-anchor="middle" fill="var(--cpf-ink, #17232e)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5">one</text>
<a class="badge" href="#detail-e1">
<circle class="bdg" cx="178" cy="107" r="5" fill="var(--cpf-accent, #2f6b8f)"/>
</a>
</g>
<g class="ev ev-message" id="flow-e2">
<rect class="hl" x="0" y="114" width="100%" height="46" fill="none"/>
<line class="ln" x1="403" y1="153" x2="544" y2="153" stroke="var(--cpf-ink, #17232e)"/>
<polygon class="ah" points="553,153 544,149 544,157" fill="var(--cpf-ink, #17232e)"/>
<text class="cap" x="478" y="134" text-anchor="middle" fill="var(--cpf-ink, #17232e)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5">two</text>
<a class="badge" href="#detail-e2">
<circle class="bdg" cx="478" cy="153" r="5" fill="var(--cpf-accent, #2f6b8f)"/>
</a>
</g>
<g class="ev ev-message" id="flow-e3">
<rect class="hl" x="0" y="160" width="100%" height="46" fill="none"/>
<line class="ln" x1="703" y1="199" x2="112" y2="199" stroke="var(--cpf-ink, #17232e)"/>
<polygon class="ah" points="103,199 112,195 112,203" fill="var(--cpf-ink, #17232e)"/>
<text class="cap" x="403" y="180" text-anchor="middle" fill="var(--cpf-ink, #17232e)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5">three</text>
<a class="badge" href="#detail-e3">
<circle class="bdg" cx="403" cy="199" r="5" fill="var(--cpf-accent, #2f6b8f)"/>
</a>
</g>
</svg>
</div></section>
<section class="cpf-detail" aria-label="Details"><div class="cpf-tscroll">
<table class="cpf-table">
<thead><tr><th>#</th><th>Kind</th><th>From → To</th><th>Message and details</th><th>Notes</th><th>Line</th></tr></thead>
<tbody>
<tr id="detail-e1">
<th class="k" scope="row"><a class="back" href="#flow-e1" aria-label="Back to this event in the diagram">↑ ·</a></th>
<td><span class="pill">message</span></td>
<td>A → B</td>
<td><strong>one</strong></td>
<td>—</td>
<td>7</td>
</tr>
<tr id="detail-e2">
<th class="k" scope="row"><a class="back" href="#flow-e2" aria-label="Back to this event in the diagram">↑ ·</a></th>
<td><span class="pill">message</span></td>
<td>C → D</td>
<td><strong>two</strong></td>
<td>—</td>
<td>8</td>
</tr>
<tr id="detail-e3">
<th class="k" scope="row"><a class="back" href="#flow-e3" aria-label="Back to this event in the diagram">↑ ·</a></th>
<td><span class="pill">message</span></td>
<td>E → A</td>
<td><strong>three</strong></td>
<td>—</td>
<td>9</td>
</tr>
</tbody>
</table>
</div></section>
</div>
</div>
</body>
</html>
